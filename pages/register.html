<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="A register form for placeholdername" />

    <title>social media | Register</title>

    <link rel="stylesheet" href="../css/styles.css" />
  </head>

  <body>
    <header>
      <a href="../index.html" class="logo">SocialLogo</a>

      <section class="headmid">
        <a href="../index.html">Feed</a>

        <form class="search" id="search-form">
          <input type="search" id="search-input" placeholder="Search" />
          <button type="submit">Search</button>
        </form>
      </section>

      <section class="authhead"></section>
    </header>

    <main>
      <form class="registerform">
        <h1>Register</h1>

        <div>
          <label for="user">Username</label>
          <input type="text" id="user" required />
        </div>

        <div>
          <label for="email">Email</label>
          <input type="email" id="email" required />
        </div>

        <div>
          <label for="password">Password</label>
          <input type="password" id="password" required />
        </div>

        <button type="submit">Register</button>
      </form>
    </main>
    <script type="module" src="../js/register.js"></script>
    <script type="module" src="../js/header.js"></script>
    <footer>
      <section class="contact-us">
        <h2>Contact us</h2>
        <p>Email: Placeholder@mail.com</p>
        <p>Phone: 1234567890</p>
        <p>Chat with us</p>
      </section>

      <section class="Info">
        <h2>Information</h2>
        <p>About us</p>
        <p>Privacy Policy</p>
        <p>Terms of Service</p>
      </section>
    </footer>
  </body>
</html>
