<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="profile for social media" />

    <title>Name | Profile</title>

    <link rel="stylesheet" href="../css/styles.css" />
  </head>

  <body>
    <header>
      <a href="../index.html" class="logo">SocialLogo</a>

      <section class="headmid">
        <a href="../index.html">Feed</a>

        <form class="search" id="search-form">
        <input type="search" id="search-input" placeholder="Search"/>
          <button type="submit">Search</button>
        </form>
      </section>

      <section class="authhead"></section>
    </header>

    <main>
      <section id="profile"></section>

      <button id="follow"></button>

      <button id="logout">Log out</button>

     

      <section id="create-post">
        <h2>Create a Post</h2>

        <form id="create-post-form">
          <div>
            <label for="post-title">Title</label>
            <input type="text" id="post-title" required />
          </div>

          <div>
            <label for="post-body">Post</label>
            <textarea id="post-body" required></textarea>
          </div>

          <div>
            <label for="post-media">Image URL</label>
            <input type="url" id="post-media" />
          </div>

          <button type="submit">Create Post</button>
        </form>
        </section>

         <section id="my-posts">
        <h1>Posts</h1>
        </section>
    </main>

    <script type="module" src="../js/profile.js"></script>
    <script type="module" src="../js/header.js"></script>
    <script type="module" src="../js/makepost.js"></script>
    <footer>
      <section class="contact-us">
        <h2>Contact us</h2>
        <p>Email: Placeholder@mail.com</p>
        <p>Phone: 1234567890</p>
        <p>Chat with us</p>
      </section>

      <section class="Info">
        <h2>Information</h2>
        <p>About us</p>
        <p>Privacy Policy</p>
        <p>Terms of Service</p>
      </section>
    </footer>
  </body>
</html>
